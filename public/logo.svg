<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" fill="none">
  <defs>
    <!-- Multi-color vibrant color regions -->
    <radialGradient id="topOrange" cx="55%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#FF7A30"/>
      <stop offset="60%" stop-color="#FF5528"/>
      <stop offset="100%" stop-color="#FF3838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leftYellow" cx="25%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#FFDF2B"/>
      <stop offset="70%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF9800" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomPink" cx="30%" cy="75%" r="35%">
      <stop offset="0%" stop-color="#FF3377"/>
      <stop offset="70%" stop-color="#E91E63"/>
      <stop offset="100%" stop-color="#C2185B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerCyan" cx="65%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#0091EA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomPurple" cx="60%" cy="85%" r="35%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="65%" stop-color="#651FFF"/>
      <stop offset="100%" stop-color="#4A148C" stop-opacity="0"/>
    </radialGradient>

    <!-- Fingerprint Mask Silhouette -->
    <clipPath id="fingerprintOval">
      <ellipse cx="150" cy="130" rx="68" ry="92" />
    </clipPath>

    <!-- Filter for subtle organic glow -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fingerprint Graphic Group -->
  <g id="fingerprintEmblem">
    <!-- Base Color Cloud clipped to Oval -->
    <g clip-path="url(#fingerprintOval)">
      <!-- Background blend base -->
      <rect x="50" y="20" width="200" height="220" fill="#FFA000" />
      <rect x="50" y="20" width="200" height="220" fill="url(#topOrange)" />
      <rect x="50" y="20" width="200" height="220" fill="url(#leftYellow)" />
      <rect x="50" y="20" width="200" height="220" fill="url(#bottomPink)" />
      <rect x="50" y="20" width="200" height="220" fill="url(#centerCyan)" />
      <rect x="50" y="20" width="200" height="220" fill="url(#bottomPurple)" />

      <!-- Deepening ridge grooves across the color field -->
      <g stroke="#0A0B1E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.32" fill="none">
        <path d="M 150 48 C 122 48 98 72 98 105 C 98 142 108 178 116 210" />
        <path d="M 150 56 C 127 56 106 78 106 108 C 106 142 115 174 122 204" />
        <path d="M 150 64 C 132 64 114 84 114 112 C 114 144 122 170 128 198" />
        <path d="M 150 72 C 136 72 122 90 122 116 C 122 144 128 168 134 192" />
        <path d="M 150 80 C 140 80 130 96 130 120 C 130 144 135 166 140 186" />
        <path d="M 150 88 C 144 88 138 102 138 124 C 138 144 142 162 146 180" />
        
        <!-- Center Loop / Whorl -->
        <path d="M 150 96 C 146 96 144 108 144 126 C 144 142 148 156 150 174" />
        <path d="M 150 104 C 148 104 147 114 147 128 C 147 138 149 150 150 166" />

        <!-- Right Side Ridges -->
        <path d="M 150 48 C 178 48 202 72 202 105 C 202 142 192 178 184 210" />
        <path d="M 150 56 C 173 56 194 78 194 108 C 194 142 185 174 178 204" />
        <path d="M 150 64 C 168 64 186 84 186 112 C 186 144 178 170 172 198" />
        <path d="M 150 72 C 164 72 178 90 178 116 C 178 144 172 168 166 192" />
        <path d="M 150 80 C 160 80 170 96 170 120 C 170 144 165 166 160 186" />
        <path d="M 150 88 C 156 88 162 102 162 124 C 162 144 158 162 154 180" />
        <path d="M 150 96 C 154 96 156 108 156 126 C 156 142 152 156 150 174" />

        <!-- Diagonal Sweeping Biometric Arcs (matching authentic logo friction ridges) -->
        <path d="M 92 120 Q 150 110 208 120" />
        <path d="M 88 135 Q 150 125 212 135" />
        <path d="M 86 150 Q 150 140 214 150" />
        <path d="M 88 165 Q 150 155 212 165" />
        <path d="M 94 180 Q 150 170 206 180" />
        <path d="M 104 195 Q 150 185 196 195" />
        <path d="M 118 208 Q 150 200 182 208" />
      </g>

      <!-- Highlights / Bright Ridge Reflections -->
      <g stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.45" fill="none">
        <path d="M 96 110 C 105 85 125 68 150 68 C 175 68 195 85 204 110" />
        <path d="M 102 125 Q 150 115 198 125" />
        <path d="M 108 140 Q 150 130 192 140" />
        <path d="M 112 155 Q 150 145 188 155" />
        <path d="M 120 170 Q 150 160 180 170" />
      </g>
    </g>
  </g>

  <!-- Typography: DAKSH -->
  <text x="150" y="280" 
        font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" 
        font-size="46" 
        font-weight="800" 
        letter-spacing="6" 
        text-anchor="middle" 
        fill="#FFFFFF">
    DAKSH
  </text>

  <!-- Subtitle: TRUST YOUR TOUCH -->
  <text x="150" y="306" 
        font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" 
        font-size="12" 
        font-weight="700" 
        letter-spacing="4.5" 
        text-anchor="middle" 
        fill="#94A3B8">
    TRUST YOUR TOUCH
  </text>
</svg>
